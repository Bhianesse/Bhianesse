name: XOLAX

on:
  push:
    branches: [main]
  schedule:
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bhns0:
    runs-on: ubuntu-latest
    timeout-minutes: 17

    steps:
      - uses: actions/checkout@v7

      - name: ✓
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: 'pip'

      - name: ✓
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: xvfb

      - name: ✓
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps
          playwright install chrome firefox   

      - name: ✓
        run: |
          sudo apt-get update

          wget -q \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo apt install -y \
            ./google-chrome-stable_current_amd64.deb

          google-chrome --version

      - name: ✓
        run: |

          CHROME_VERSION=$(google-chrome --version | awk '{print $3}')

          CHROME_MAJOR=$(echo $CHROME_VERSION | cut -d '.' -f1)

          echo "CHROME VERSION: $CHROME_VERSION"
          echo "CHROME MAJOR: $CHROME_MAJOR"

          DRIVER_VERSION=$(curl -s \
            "https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_${CHROME_MAJOR}")

          echo "DRIVER VERSION: $DRIVER_VERSION"

          wget -q -O chromedriver.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/${DRIVER_VERSION}/linux64/chromedriver-linux64.zip"

          unzip chromedriver.zip

          sudo mv chromedriver-linux64/chromedriver \
            /usr/local/bin/chromedriver

          sudo chmod +x /usr/local/bin/chromedriver

          chromedriver --version

      - name: ✓
        run: |
          echo "${{ secrets.XOLAX_PY }}" | base64 -d > xolax.py
          chmod +x xolax.py

      - name: ✓
        run: xvfb-run python xolax.py --debug 

      - name: ✓
        run: |
          git config --local user.email "eyayq@users.noreply.github.com"
          git config --local user.name "eyayq"
          git add a/b/c/d/e/f/g/h/i/j/k/l/m/n/o/p/q/r/s/t/u/v/w/x/y/z/xolax.php

          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi

          git commit -m "up $(date)"

          for i in $(seq 1 16); do
            git pull --rebase --autostash origin main && git push origin main && break
            echo "❌ Attempt $i failed, retrying..."
            sleep 5
          done   
