name: Update Sports Streams Cache

on:
  schedule:
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Restore Python script from Base64 secret
        run: |
          echo "${{ secrets.KEY_PY_BASE64 }}" | base64 -d > key.py

      - name: Run scraper
        run: |
          python key.py

      - name: Commit playlist if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add uwir.php

          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "🔄 Auto update playlist $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
          fi
